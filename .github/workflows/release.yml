name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 标签不会触发 ci.yml，所以发行流水线必须自己验证一次；测试失败时不会打包或发布。
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: windows-latest
    env:
      GITEE_REPOSITORY: ${{ secrets.GITEE_REPOSITORY }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: src/WuGesture.App/Web
        run: pnpm install --frozen-lockfile

      - name: Create release package
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version $env:GITHUB_REF_NAME

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Get-ChildItem artifacts/release/*.zip | Select-Object -First 1
          $notes = Get-Item artifacts/release/RELEASE_NOTES.md
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $archive.FullName --clobber
            gh release edit $env:GITHUB_REF_NAME --notes-file $notes.FullName
          } else {
            gh release create $env:GITHUB_REF_NAME $archive.FullName --title "WuGesture $env:GITHUB_REF_NAME" --notes-file $notes.FullName
          }

      - name: Mirror code and tag to Gitee
        if: ${{ env.GITEE_REPOSITORY != '' && env.GITEE_TOKEN != '' }}
        shell: pwsh
        run: |
          git remote add gitee "https://oauth2:$env:GITEE_TOKEN@gitee.com/$env:GITEE_REPOSITORY.git"
          git push gitee "${env:GITHUB_SHA}:refs/heads/main"
          git push gitee "refs/tags/${env:GITHUB_REF_NAME}:refs/tags/${env:GITHUB_REF_NAME}"

      - name: Create Gitee release
        if: ${{ env.GITEE_REPOSITORY != '' && env.GITEE_TOKEN != '' }}
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifacts/release/*.zip | Select-Object -First 1
          ./scripts/upload-gitee-release.ps1 -Repository $env:GITEE_REPOSITORY -Token $env:GITEE_TOKEN -Version $env:GITHUB_REF_NAME -NotesPath artifacts/release/RELEASE_NOTES.md -AssetPath @($archive.FullName) -TargetCommitish $env:GITHUB_SHA
